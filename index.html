<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Video IA">
<meta name="theme-color" content="#0b0b10">
<title>Video IA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#eee;font-family:-apple-system,system-ui,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0 0 12px}textarea{width:100%;min-height:140px;background:#16161f;color:#fff;border:1px solid #333;border-radius:14px;padding:12px;font-size:16px;resize:vertical}
h2{font-size:14px;color:#999;text-transform:uppercase;margin:20px 0 8px}
button{display:block;width:100%;text-align:left;background:#1d1d2a;color:#fff;border:0;border-radius:14px;padding:14px;margin:8px 0;font-size:17px}
button small{display:block;color:#999;font-size:13px;margin-top:2px}button:active{background:#2c2c40}
#msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#3b82f6;color:#fff;padding:14px;border-radius:14px;display:none;font-size:15px}
</style></head><body>
<h1>Video IA</h1>
<textarea id="p" placeholder="Escribí tu prompt..."></textarea>
<h2>Video</h2><div id="v"></div>
<h2>Imagen</h2><div id="i"></div>
<div id="msg"></div>
<script>
const S={v:[["Grok Imagine","https://grok.com/imagine","Imagen y video"],["Pika","https://pika.art","Video"],["Hailuo (MiniMax)","https://hailuoai.video","Video"],["Kling AI","https://klingai.com","Video"],["Vidu","https://www.vidu.com","Video"]],
i:[["Leonardo.Ai","https://leonardo.ai","Imagen, créditos diarios"],["Tensor.Art","https://tensor.art","Imagen, créditos diarios"],["Perchance","https://perchance.org/ai-text-to-image-generator","Imagen, sin cuenta"]]};
const p=document.getElementById('p');p.value=localStorage.getItem('prompt')||'';p.oninput=()=>localStorage.setItem('prompt',p.value);
function show(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',4000)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{p.select();return document.execCommand('copy')}catch(e2){return false}}}
for(const k in S)S[k].forEach(([n,u,d])=>{const b=document.createElement('button');b.innerHTML=n+'<small>'+d+'</small>';
b.onclick=async()=>{const w=window.open(u,'_blank');const ok=await copy(p.value);
show(ok?'Prompt copiado, pegalo en '+n:'No se pudo copiar. Copiá el prompt a mano y pegalo en '+n);if(!w)location.href=u};document.getElementById(k).appendChild(b)});
</script></body></html>
